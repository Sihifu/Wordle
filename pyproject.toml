[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordle"
version = "0.1.0"
description = "A mathematically rigorous Wordle solver using Shannon-entropy maximisation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rich>=13.7",
    "tqdm>=4.66",
    "wordfreq>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=0.28",
    "ipykernel",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["wordle"]
omit = ["wordle/*_demo.ipynb"]

[tool.coverage.report]
show_missing = true
skip_covered = false
